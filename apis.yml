name: Aeroscout
description: AeroScout was an Israeli real-time location systems (RTLS) company that built
  Wi-Fi-based RFID tags, exciters, and location receivers together with the MobileView software
  platform to track the location, condition, and status of mobile assets and people, primarily
  for hospitals and healthcare providers. Menlo Ventures led its Series C round in 2007. AeroScout
  was acquired by Stanley Black & Decker in 2012 (~$240M) and folded into Stanley Healthcare; the
  product line and brand now live under Securitas Healthcare / Securitas Technology. AeroScout no
  longer operates as an independent company and publishes no public developer portal, OpenAPI, or
  SDKs — integration with the on-premise AeroScout Engine has historically been via a SOAP API for
  enterprise/HIS systems rather than a public web API.
